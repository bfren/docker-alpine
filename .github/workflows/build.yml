name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    uses: bfren/docker/.github/workflows/build.yml@shared-build
    with:
      image: alpine
      folders: |
        3.20
        3.21
        3.22
        3.23
        3.24
      platforms: |
        linux/amd64
        linux/arm/v7
        linux/arm64
      tags: |
        alpine${FOLDER}-tjs
        alpine${FOLDER}-tjs-${VERSION_MAJOR}
        alpine${FOLDER}-tjs-${VERSION_MINOR}
        alpine${FOLDER}-tjs-${VERSION}
        alpine${ALPINE_REVISION}-tjs
        alpine${ALPINE_REVISION}-tjs-${VERSION}
      default-folder: "3.24"
      default-tags: |
        tjs
        tjs-${VERSION_MAJOR}
        tjs-${VERSION_MINOR}
        tjs-${VERSION}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
